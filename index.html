<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kennethtrancoding</title>
		<style>
			body {
				background-color: rgb(18, 18, 18);
				min-height: 100svh;
			}
			.underline {
				width: fit-content;
				height: fit-content;
			}
			#title {
				font-size: 120px;
				line-height: normal;
				line-height: 50%;
			}
			/* Title hover, original flavour: the letters actually grow, which
			   reflows the line and the h1's height on every hover — that is the
			   page jitter. This is the fallback; .static-title below replaces it. */
			.title-letter {
				display: inline-block;
				--s: 1;
				transition:
					font-size 0.15s ease,
					line-height 0.15s ease,
					transform 0.15s ease,
					text-shadow 0.15s ease;
				transform-origin: bottom center;
			}
			.title-letter.is-main {
				font-size: clamp(150px, 20vw, 400px);
				line-height: 0.1ex;
				text-shadow: 0 0 22px rgba(255, 255, 255, 0.9);
			}
			.title-letter.is-neighbor {
				font-size: clamp(120px, 16vw, 350px);
				line-height: 0.1ex;
				text-shadow: 0 0 14px rgba(255, 255, 255, 0.65);
			}

			/* Static hover. The .static-title class is set on <html> by script.js
			   when the STATIC_TITLE_HOVER feature flag is on: the letters scale
			   instead of resizing, so nothing reflows, and --x is the sideways
			   nudge applyLetterShifts() hands each letter to stand in for the
			   advance width the bigger letters before it would have added. */
			.static-title .title-letter {
				transform: translateX(var(--x, 0px)) scale(var(--s));
				/* Vertically centred, so a magnified letter grows evenly above and
				   below the line and stays centred on its smaller neighbours
				   instead of sitting on the baseline. */
				transform-origin: left center;
			}
			.static-title .title-letter.is-main,
			.static-title .title-letter.is-neighbor {
				font-size: inherit;
				line-height: inherit;
			}
			.static-title .title-letter.is-main {
				--s: 2;
			}
			.static-title .title-letter.is-neighbor {
				--s: 1.6;
			}
			.link-group,
			.links {
				display: flex;
				flex-direction: column;
				gap: 14px;
			}
			#title,
			.link {
				font-family: Arial, Helvetica, sans-serif;
				color: antiquewhite;
			}
			.link {
				width: fit-content;
				cursor: pointer;
				font-size: 2.5rem;
				text-decoration: none;
				margin: 0;
				display: inline-block;
				transform: scale(1);
				transition: transform 0.35s ease-in-out;
			}
			.underline::after {
				content: "";
				display: block;
				height: 3px;
				width: 100%;
				background: antiquewhite;
				transform: scaleX(0);
				transform-origin: left;
				transition: transform 0.35s ease-in-out;
			}
			.underline.is-hovered::after {
				transform: scaleX(1);
			}
			.link.is-active {
				animation-name: click-scale-down;
				animation-fill-mode: forwards;
				animation-duration: 0.05s;
				animation-timing-function: ease-in;
			}
			.link.is-post-click {
				animation-name: post-click-burst;
				animation-duration: 0.2s;
				animation-timing-function: cubic-bezier(0.75, 0.05, 0.51, 1.71);
			}

			/* Tilt mode. The .tilt class is set on <html> by script.js when the
			   TILT feature flag is on; without it the flat scale animation above
			   is what runs. */
			.tilt .link {
				will-change: transform;
				transform: perspective(700px) rotateX(0deg) rotateY(0deg) translateZ(0px);
				transition: transform 0.35s ease-out;
			}
			.tilt .link.is-active {
				animation: none;
				transition: transform 0.1s ease-out;
			}
			.tilt .link.is-post-click {
				animation: none;
				transition: transform 0.5s cubic-bezier(0.18, 1.5, 0.45, 1);
			}

			/* Apple Pencil ink overlay. Sits above everything, never takes
			   pointer input itself — script.js paints pencil strokes here
			   instead of letting them touch the page. */
			#ink-layer {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				touch-action: none;
				z-index: 9999;
			}

			@media (prefers-reduced-motion: reduce) {
				.link,
				.underline::after {
					transition: none !important;
				}
				.tilt .link {
					transform: none !important;
				}
			}
			@keyframes click-scale-down {
				0% {
					font-size: 2.5rem;
				}
				100% {
					font-size: 2.2rem;
				}
			}
			@keyframes post-click-burst {
				0% {
					font-size: 2.2rem;
				}
				100% {
					font-size: 2.5rem;
				}
			}

			/* Mobile: the name runs vertically down the left edge, one letter per
			   line, with the project links beside it. Letters grow with transform
			   instead of font-size here so the stack does not reflow on touch. */
			/* Phones: narrow screens, plus short ones so landscape gets the
			   vertical treatment instead of a wrapped 120px headline. */
			@media (max-width: 700px), (max-height: 520px) {
				body {
					display: flex;
					align-items: center;
					padding: 18px 14px;
					box-sizing: border-box;
				}
				.link-group {
					flex-direction: row;
					align-items: center;
					gap: 18px;
					width: 100%;
				}
				.links {
					flex: 1 1 auto;
					min-width: 0;
					gap: 18px;
				}
				.underline {
					max-width: 100%;
				}
				#title {
					display: flex;
					flex-direction: column;
					align-items: center;
					flex: 0 0 auto;
					margin: 0;
					/* 17 stacked letters, so the svh term keeps the column from
					   running off the bottom in landscape. */
					font-size: clamp(0.85rem, min(7vw, 4.4svh), 2.25rem);
					line-height: 1.02;
				}
				/* The column is vertical here, so the letters scale in place under
				   either flag and ignore the horizontal --x offset. Each rule is
				   repeated for .static-title so it outranks the desktop static
				   rules above, which are one class more specific. */
				.title-letter,
				.static-title .title-letter {
					display: block;
					transform: scale(var(--s));
					transform-origin: center center;
				}
				.title-letter.is-main,
				.title-letter.is-neighbor,
				.static-title .title-letter.is-main,
				.static-title .title-letter.is-neighbor {
					font-size: inherit;
					line-height: inherit;
				}
				.title-letter.is-main,
				.static-title .title-letter.is-main {
					--s: 1.75;
					text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
				}
				.title-letter.is-neighbor,
				.static-title .title-letter.is-neighbor {
					--s: 1.35;
					text-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
				}
				.link {
					font-size: clamp(0.9rem, 4vw, 1.15rem);
				}
				/* The desktop click animation keyframes hard-code 2.5rem, so swap
				   in a scale-based press for the smaller mobile type. */
				.link.is-active {
					animation: none;
					transform: scale(0.94);
					transition: transform 0.05s ease-in;
				}
				.link.is-post-click {
					animation: none;
					transform: scale(1);
					transition: transform 0.2s cubic-bezier(0.75, 0.05, 0.51, 1.71);
				}
			}
		</style>
	</head>
	<body>
		<div class="link-group">
			<h1 id="title">Kennethtrancoding</h1>
			<div class="links">
				<div class="underline">
					<p class="link" data-ref="https://myfirstday.kennethtrancoding.com/">
						<strong>My First Day</strong> – Congressional App Challenge [October 30,
						2025]
					</p>
				</div>

				<div class="underline">
					<p class="link" data-ref="./Presidential-AI-Challenge.pdf">
						<strong>Basic Life-Support</strong> – Presidential AI Challenge [January 20,
						2026]
					</p>
				</div>

				<div class="underline">
					<p class="link" data-ref="./metric-conversions">Metric Conversions (Quiz)</p>
				</div>

				<div class="underline">
					<p class="link" data-ref="./wordpile">Wordpile</p>
				</div>
			</div>
		</div>

		<canvas id="ink-layer" aria-hidden="true"></canvas>

		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
